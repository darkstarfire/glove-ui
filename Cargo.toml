[workspace]
resolver = "2"
members = ["crates/i18n", "crates/paint", "crates/config", "crates/ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/fabioaacarneiro/glove-ui"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
